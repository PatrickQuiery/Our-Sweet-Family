<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- Arc for "Our" text (upper-left of heart) -->
    <path id="ourArc" d="M 88,155 A 125,125 0 0,1 200,72"/>
    <!-- Arc for "Sweet" text (upper-right of heart) -->
    <path id="sweetArc" d="M 200,72 A 125,125 0 0,1 312,155"/>
  </defs>

  <!-- Red heart outline -->
  <path d="M200,322
           C155,285 55,240 55,155
           C55,105 92,72 138,72
           C163,72 183,85 200,105
           C217,85 237,72 262,72
           C308,72 345,105 345,155
           C345,240 245,285 200,322 Z"
        fill="none" stroke="#C00000" stroke-width="9" stroke-linejoin="round"/>

  <!-- "Our" text curved along upper-left -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#111111">
    <textPath href="#ourArc" startOffset="8%">Our</textPath>
  </text>

  <!-- "Sweet" text curved along upper-right -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#111111">
    <textPath href="#sweetArc" startOffset="18%">Sweet</textPath>
  </text>

  <!-- Family silhouette -->
  <!-- Man (left) - head tilted right toward woman -->
  <ellipse cx="163" cy="158" rx="19" ry="21" fill="none" stroke="#1a1a1a" stroke-width="3.5"/>
  <!-- Man neck & left shoulder -->
  <path d="M150,178 C143,192 140,210 143,230" fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Man right shoulder / arm reaching toward baby -->
  <path d="M178,180 C184,195 192,210 197,228" fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Man left hand under baby -->
  <path d="M143,225 C148,235 160,240 176,242" fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Woman (right) - head tilted left toward man -->
  <ellipse cx="237" cy="158" rx="19" ry="21" fill="none" stroke="#1a1a1a" stroke-width="3.5"/>
  <!-- Woman hair flowing -->
  <path d="M250,148 C262,140 268,157 262,170 C268,162 266,178 256,180" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <!-- Woman neck & right shoulder -->
  <path d="M250,178 C257,192 260,210 257,230" fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Woman left shoulder / arm reaching toward baby -->
  <path d="M222,180 C216,195 208,210 203,228" fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Woman right hand under baby -->
  <path d="M257,225 C252,235 240,240 224,242" fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Baby (centre, cradled) -->
  <ellipse cx="200" cy="228" rx="16" ry="18" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Baby swaddle -->
  <path d="M186,240 C185,255 215,255 214,240" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <!-- Baby tiny arm / hand reaching up -->
  <path d="M188,232 C182,224 186,218 192,222" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- "Family" in italic serif script at bottom -->
  <text x="200" y="370"
        font-family="Georgia, 'Palatino Linotype', Palatino, serif"
        font-style="italic"
        font-size="50"
        fill="#111111"
        text-anchor="middle">Family</text>
</svg>
